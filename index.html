<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="game" class="justify-center flex-column">
            
            <div id="hud">
                <div class="hud-item">
                    <p class="hud-prefix">Question</p>
                    <h1 class="hud-main-text" id="progressText">1/20</h1>
                </div>
                <div class="hud-item">
                    <p class="hud-prefix">Score</p>
                    <h1 class="hud-main-text" id="score">0</h1>
                </div>
            </div>

            <h2 id="question"></h2>

            <div class="choice-container">
                <p class="choice-prefix">A</p>
                <button class="choice-text" data-number="1"></button>
            </div>

            <div class="choice-container">
                <p class="choice-prefix">B</p>
                <button class="choice-text" data-number="2"></button>
            </div>

            <div class="choice-container">
                <p class="choice-prefix">C</p>
                <button class="choice-text" data-number="3"></button>
            </div>

            <div class="choice-container">
                <p class="choice-prefix">D</p>
                <button class="choice-text" data-number="4"></button>
            </div>

        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
